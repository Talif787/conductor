name: control-api-ci

on:
  push:
    paths:
      - "services/control-api/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "services/control-api/**"

defaults:
  run:
    working-directory: services/control-api

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy app
      - name: Test
        run: pytest -m "not integration"

  integration:
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: conductor
          POSTGRES_PASSWORD: conductor
          POSTGRES_DB: conductor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U conductor"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CONDUCTOR_DB_URL: postgresql+asyncpg://conductor:conductor@localhost:5432/conductor
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Migrate
        run: alembic upgrade head
      - name: Integration tests
        run: pytest -m integration

  build-image:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t conductor-control-api:${{ github.sha }} .
