name: control-api-ci

on:
  push:
    paths:
      - "services/control-api/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "services/control-api/**"

defaults:
  run:
    working-directory: services/control-api

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy app
      - name: Test
        run: pytest

  build-image:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t conductor-control-api:${{ github.sha }} services/control-api
