# Free daily database backup: pg_dump to a GitHub Actions artifact.
# $0 substitute for managed point-in-time recovery. Complements Neon branching.
name: db-backup

on:
  schedule:
    - cron: "0 6 * * *" # daily at 06:00 UTC
  workflow_dispatch: {} # allow manual runs

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install PostgreSQL client 18
        run: |
          # Use PGDG's official setup script (non-interactive) so we get a
          # pg_dump matching the Neon server major. Avoids manual gpg --dearmor,
          # which fails on CI runners with a /dev/tty error.
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-18
          /usr/lib/postgresql/18/bin/pg_dump --version

      - name: Dump database
        env:
          # Raw Neon connection string in libpq form (postgresql://...), NOT the
          # +asyncpg app URL. Keep sslmode=require; channel_binding is stripped.
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "NEON_DATABASE_URL secret is not set" >&2
            exit 1
          fi
          # Tolerate a stray trailing newline in the secret, and drop the
          # channel_binding param (pg_dump rejects it on some client builds).
          url="$(printf '%s' "$DATABASE_URL" | tr -d '[:space:]')"
          url="$(printf '%s' "$url" | sed -E 's/([?&])channel_binding=[^&]*//; s/[?&]$//')"
          ts="$(date -u +%Y%m%dT%H%M%SZ)"
          out="conductor-${ts}.dump"
          # Put client 18 first on PATH; the base image ships an older pg_dump
          # at /usr/bin that would otherwise win and fail on the newer server.
          export PATH="/usr/lib/postgresql/18/bin:$PATH"
          pg_dump --version
          # Custom format (-Fc): compressed and restorable with pg_restore.
          pg_dump "$url" --no-owner --no-privileges -Fc -f "$out"
          ls -lh "$out"
          echo "BACKUP_FILE=$out" >> "$GITHUB_ENV"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v7
        with:
          name: conductor-db-backup-${{ github.run_id }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 30
          if-no-files-found: error
